<!doctype html>
<html lang="zh-CN">

  <style>
:root{color-scheme:light;--bg:#f4f6fa;--surface:#fff;--ink:#17283b;--muted:#526579;--line:#dce4ee;--primary:#22486d;--primary-hover:#173754;--on-primary:#fff;--pale:#eaf0f7;--accent:#325c83;--hero:#1b3450;--hero-end:#2b5475;--good:#21694c;--bad:#9a3e34;--shadow:0 12px 40px #2843600b;--header:rgba(255,255,255,.95);font-family:"Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#101924;--surface:#172333;--ink:#edf3f9;--muted:#a9bbce;--line:#304256;--primary:#aac9e6;--primary-hover:#c3ddf5;--on-primary:#12273a;--pale:#22354a;--accent:#bdd7ee;--hero:#1b3149;--hero-end:#294969;--good:#84d6ab;--bad:#ffad9c;--header:rgba(23,35,51,.96);--shadow:0 12px 40px #0002}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
button{color:inherit}
.topbar{background:var(--header);border-bottom:1px solid var(--line)}
.top-inner{max-width:1112px;margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:770;font-size:21px;letter-spacing:-.035em}
.brand-mark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:20px;font-weight:650;line-height:1}
nav{display:flex;gap:5px}
nav button,.icon-button{border:1px solid transparent;background:none;border-radius:9px;padding:7px 13px;color:var(--muted);white-space:nowrap}
nav button[aria-current=page],nav button:hover,.icon-button:hover{background:var(--pale);color:var(--ink)}
.icon-button{min-width:38px;padding:6px 9px;border-color:var(--line);font-size:17px}
main{max-width:1112px;padding:34px 24px 48px;margin:auto}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:242px;padding:36px 42px;display:flex;align-items:center;border-radius:22px;color:#f8fbff;background:linear-gradient(108deg,var(--hero) 10%,var(--hero-end))}
.hero::before,.hero::after,.hero-art{content:"";position:absolute;z-index:-1;pointer-events:none}
.hero::before{width:380px;height:380px;border:1px solid #d8e8f655;right:-40px;top:-74px;border-radius:50%;box-shadow:0 0 0 32px #d9eaff0b,0 0 0 66px #d9eaff0a}
.hero::after{right:5%;top:14%;width:180px;height:180px;border-radius:50%;background:linear-gradient(160deg,#bad3ea36,#bad3ea09)}
.hero-art{width:280px;height:155px;right:7%;bottom:-39px;transform:rotate(-13deg);border-radius:110% 110% 0 0;border:1px solid #d8e8f644;background:#96b8d225;box-shadow:0 -22px 0 #d9eaff0d}
.hero p{color:#dbe8f6;margin:0 0 5px}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(29px,5.2vw,48px);line-height:1.18;letter-spacing:-.045em;margin:0 0 22px}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.button{min-height:42px;padding:8px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:650;text-align:center}
.button:hover:not(:disabled){background:var(--pale)}
.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.primary:hover:not(:disabled){background:var(--primary-hover)}
.hero .primary{background:#fff;border-color:#fff;color:#1b3651}
.hero .primary:hover{background:#e5effb}
.hero .secondary{color:#f7fbff;background:#172d4560;border-color:#d8e8f688}
.hero .secondary:hover:not(:disabled){background:#ffffff26}
.hero .button{min-width:107px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:29px 0 12px}
h2{font-size:20px;margin-bottom:0;letter-spacing:-.02em}
.muted,.meta{color:var(--muted)}
.meta{font-size:13px}
.lesson-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lesson{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:123px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.lesson:hover,.lesson[aria-pressed=true]{border-color:var(--accent)}
.lesson[aria-pressed=true]{background:var(--pale)}
.lesson strong{font-size:15px;line-height:1.4;flex:1}
.lesson-footer{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.mini-progress{display:inline-block;width:44px;height:4px;background:var(--line);border-radius:9px;overflow:hidden}
.mini-progress span{display:block;height:100%;background:var(--accent)}
.study{max-width:680px;margin:auto}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{padding:5px 2px;border:0;background:none;color:var(--accent);font-weight:650}
progress{appearance:none;width:100%;display:block;height:7px;border:0;background:var(--line);border-radius:10px;overflow:hidden;margin:0 0 18px}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--accent);border-radius:10px}
progress::-moz-progress-bar{background:var(--accent);border-radius:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.question{min-height:275px;text-align:center;display:grid;align-content:center;justify-items:center;padding:22px 18px}
.prompt{color:var(--muted);margin:0 0 19px;font-size:14px}
.word-block{display:grid;justify-items:center;gap:3px}
.score{font-size:15px;letter-spacing:.03em;color:var(--accent);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.3}
.wordline{display:inline-flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:5px 8px;max-width:100%;line-height:1.22}
.word{font-size:clamp(27px,6vw,45px);font-weight:750;overflow-wrap:anywhere}
.pitch{font-weight:680;font-size:1.25em;color:var(--accent);white-space:nowrap;letter-spacing:-.06em}
.wordline sup{font-size:.62em}
.kana{margin:3px 0 0;color:var(--muted);font-size:17px;overflow-wrap:anywhere}
.definition{font-size:17px;margin:12px 0 5px;overflow-wrap:anywhere}
.question .icon-button{margin-top:10px;font-size:14px}
.choices{display:grid;gap:9px;margin-top:12px}
.choice{text-align:left;padding:12px 15px}
.choice small{display:inline-grid;place-items:center;border-radius:6px;background:var(--pale);width:25px;height:25px;margin-right:9px;color:var(--accent)}
.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.feedback{color:var(--good);font-weight:650;margin:0 0 10px}
.feedback.bad{color:var(--bad)}
.spell{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
input,select{min-height:42px;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:8px 12px}
.book-head,.stats-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.book-head h1,.stats-head h1{font-size:29px;margin:0}
.filters{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:13px}
.word-list{list-style:none;margin:0;padding:0}
.word-list li{display:grid;grid-template-columns:minmax(125px,1fr) minmax(130px,1fr) auto;gap:8px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line)}
.word-list li:last-child{border:0}
.word-list .word{font-size:17px}
.word-list .pitch{font-size:14px}
.word-list .kana{font-size:13px;margin:2px 0 0}
.word-list .meta{font-size:12px}
.word-list .button,.word-list .icon-button{min-height:34px;font-size:12px;padding:5px 9px}
.empty,.result{padding:25px}
.result h1{font-size:27px;margin-bottom:9px}
.result .actions{margin-top:17px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:15px}
.stat strong{display:block;font-size:29px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:15px 0 0}
.source-note{margin-top:11px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.lesson-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.top-inner{min-height:57px;padding:0 12px;gap:6px}.brand{font-size:19px;gap:6px}.brand-mark{width:29px;height:29px;font-size:16px}nav{gap:0}nav button{padding:6px 8px;font-size:13px}main{padding:17px 12px 36px}.hero{min-height:195px;padding:24px 18px;border-radius:15px}.hero::before{right:-210px}.hero::after{right:-45px}.hero-art{right:-105px}.hero h1{margin-bottom:15px}.lesson-grid{gap:7px}.lesson{min-height:112px;padding:10px}.section-head{margin-top:21px}.question{min-height:245px}.study{padding-bottom:66px}.rating{position:fixed;z-index:2;bottom:0;left:0;right:0;background:var(--header);padding:9px 12px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--line);margin:0}.word-list li{grid-template-columns:1fr auto;padding:9px 11px}.word-list li>div:nth-child(2){grid-row:2;grid-column:1/-1}.stat-grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.book-head,.stats-head{align-items:flex-start}.book-head h1,.stats-head h1{font-size:23px}}
.word-block{grid-template-columns:minmax(0,auto) auto;column-gap:8px;max-width:100%;align-items:baseline}
.word-block .score,.word-block .word{grid-column:1}
.word-block .wordline{display:contents}
.word-block .pitch{grid-column:2;grid-row:2;align-self:center}
.word-block .kana{grid-column:1/-1}
</style>
  
  
</head>

na":"とりのこす","pitch":"4","pos":"他五","meaning":"留下，剩下，落下"},{"id":"8-34","word":"そうすると","kana":"そうすると","pitch":"3","pos":"接","meaning":"这样一来"},{"id":"8-35","word":"正直","kana":"しょうじき","pitch":"4","pos":"名","meaning":"老实，正直"},{"id":"8-36","word":"公衆","kana":"こうしゅう","pitch":"0","pos":"名","meaning":"公众，大众"},{"id":"8-37","word":"公衆道徳","kana":"こうしゅうどうとく","pitch":"5","pos":"名","meaning":"公共道德"},{"id":"8-38","word":"公衆道徳を守る","kana":"こうしゅうどうとくをまもる","pitch":"—","pos":"连语","meaning":"遵守公共道德"},{"id":"8-39","word":"列の最後の方につく","kana":"れつのさいごのほうにつく","pitch":"—","pos":"连语","meaning":"到队尾排队，排在最后一人后面"},{"id":"8-40","word":"未知","kana":"みち","pitch":"1","pos":"名","meaning":"未知"},{"id":"8-41","word":"当然","kana":"とうぜん","pitch":"0","pos":"副","meaning":"当然，应当"},{"id":"8-42","word":"果たす","kana":"はたす","pitch":"2","pos":"他五","meaning":"完成，履行"},{"id":"8-43","word":"もちろんのこと","kana":"もちろんのこと","pitch":"—","pos":"连语","meaning":"理所当然，自不待言"},{"id":"8-44","word":"はっきりしている","kana":"はっきりしている","pitch":"—","pos":"连语","meaning":"明确，清楚明白"},{"id":"8-45","word":"正当","kana":"せいとう","pitch":"0","pos":"名","meaning":"正当，合理"},{"id":"8-46","word":"平気","kana":"へいき","pitch":"0","pos":"名","meaning":"平心静气；不在乎"},{"id":"8-47","word":"先方","kana":"せんぽう","pitch":"0","pos":"名","meaning":"对方"},{"id":"8-48","word":"事情","kana":"じじょう","pitch":"0","pos":"名","meaning":"情况，缘由"},{"id":"8-49","word":"返答","kana":"へんとう","pitch":"3","pos":"名","meaning":"答复，回答"},{"id":"8-50","word":"なるほど","kana":"なるほど","pitch":"0","pos":"副","meaning":"原来如此，的确如此"},{"id":"8-51","word":"納得","kana":"なっとく","pitch":"0","pos":"名","meaning":"理解，认可，想通"},{"id":"8-52","word":"引っ込める","kana":"ひっこめる","pitch":"4","pos":"他一","meaning":"收回，撤回"},{"id":"8-53","word":"きわめて","kana":"きわめて","pitch":"2","pos":"副","meaning":"极其，非常"},{"id":"8-54","word":"筋","kana":"すじ","pitch":"1","pos":"名","meaning":"条理，线索"},{"id":"8-55","word":"筋が通る","kana":"すじがとおる","pitch":"—","pos":"连语","meaning":"合乎道理，说得通"},{"id":"8-56","word":"作用","kana":"さよう","pitch":"1","pos":"名","meaning":"作用，起作用"},{"id":"8-57","word":"両面","kana":"りょうめん","pitch":"3","pos":"名","meaning":"两面，两个方面"},{"id":"8-58","word":"真実","kana":"しんじつ","pitch":"1","pos":"名","meaning":"真实，事实"}]}];

<script>
'use strict';

const lessons = window.KOTOBA_LESSONS;
const words = lessons.flatMap(lesson => lesson.words);
const byId = new Map(words.map(word => [word.id, word]));
const app = document.querySelector('#app');
const themeButton = document.querySelector('#theme');
const storageKey = 'kotoba-textbook-1';
const intervals = [1, 3, 7, 14, 30, 60];
const pitchMarks = '⓪①②③④⑤⑥⑦⑧⑨⑩';

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey)) || {};
    return {records: saved.records || {}, lesson: saved.lesson ?? 1, theme: saved.theme, autoplay: saved.autoplay ?? true, session: saved.session};
  } catch {
    return {records: {}, lesson: 1, autoplay: true};
  }
}

const state = load();
let session = state.session;
let view = 'home';
let query = '';
let bookLesson = state.lesson;
let storageBlocked = false;

function persist() {
  state.session = session;
  try { localStorage.setItem(storageKey, JSON.stringify(state)); }
  catch { storageBlocked = true; }
}

function dateKey(offset = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offset);
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
}

const lessonFor = id => lessons.find(lesson => lesson.id === id);
const recordFor = id => state.records[id] || {};
const newWords = () => (lessonFor(state.lesson)?.words || words).filter(word => {
  const r = recordFor(word.id);
  return !r.learned && !r.familiar;
});
const dueWords = () => words.filter(word => {
  const r = recordFor(word.id);
  return r.learned && !r.familiar && r.due <= dateKey() && r.lastReview !== dateKey();
}).sort((a,b) => recordFor(a.id).due.localeCompare(recordFor(b.id).due));

function escape(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function pitch(word) {
  if (word.pitch === '—') return '';
  const note = word.pitch.includes('†') ? '词典补录' : word.pitch.includes('※') ? '教材校注' : '';
  const marks = word.pitch.replace(/[†※]/g,'').split('／').map(n => pitchMarks[Number(n)] || n).join('');
  return '<span class="pitch" aria-label="音调 '+escape(word.pitch)+'">'+escape(marks)+(note ? '<sup title="'+note+'">'+(word.pitch.includes('†')?'†':'※')+'</sup>' : '')+'</span>';
}

function wordLine(word) {
  return '<div class="wordline"><span class="word" lang="ja">'+escape(word.word)+'</span>'+pitch(word)+'</div>';
}

function wordBlock(word, score, showKana) {
  return '<div class="word-block"><div class="score" aria-label="当前单词答对 '+score+' 次">'+score+'/3</div>'+wordLine(word)+
    (showKana ? '<p class="kana" lang="ja">'+escape(word.kana)+'</p>' : '')+'</div>';
}

function shuffle(items) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}

function setTheme() {
  const dark = state.theme ? state.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  themeButton.textContent = dark ? '☀' : '☾';
  themeButton.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
}

function show(next) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  view = next;
  render();
  window.scrollTo(0,0);
}

function render() {
  document.querySelectorAll('nav [data-view]').forEach(button => {
    if (button.dataset.view === view || (view === 'study' && button.dataset.view === 'home')) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  if (view === 'home') app.innerHTML = home();
  if (view === 'book') { app.innerHTML = book(); renderBookList(); }
  if (view === 'stats') app.innerHTML = stats();
  if (view === 'study') app.innerHTML = study();
}

function home() {
  const selected = lessonFor(state.lesson);
  const remaining = newWords().length;
  const due = dueWords().length;
  const ongoing = session && !['complete','spellDone'].includes(session.phase);
  const scope = selected ? '第 '+selected.id+' 课' : '全部课程';
  return `<section class="hero"><div class="hero-art" aria-hidden="true"></div><div>
    <p>标准日语中级教程 · 上册</p><h1>中级日语课本词汇</h1>
    <div class="actions">
      ${ongoing ? '<button class="button primary" data-action="resume">继续练习</button>' : ''}
      <button class="button ${ongoing ? 'secondary':'primary'}" data-action="learn" ${remaining ? '' : 'disabled'}>学习 ${Math.min(10,remaining)} 个</button>
      <button class="button secondary" data-action="review" ${due ? '' : 'disabled'}>复习 ${due} 个</button>
    </div></div></section>
    <div class="section-head"><h2>选择课次</h2><span class="meta">${scope} · ${remaining} 个待学</span></div>
    <div class="lesson-grid">${lessons.map(lesson => {
      const completed = lesson.words.filter(word => {
        const r = recordFor(word.id); return r.learned || r.familiar;
      }).length;
      return `<button class="lesson" data-action="lesson" data-id="${lesson.id}" aria-pressed="${state.lesson === lesson.id}">
      <span class="meta">第 ${lesson.id} 课</span><strong lang="ja">${escape(lesson.title)}</strong>
      <span class="lesson-footer"><span>${completed} / ${lesson.words.length} 词</span><span class="mini-progress" aria-hidden="true"><span style="width:${completed/lesson.words.length*100}%"></span></span></span></button>`;
    }).join('')}</div>
    <p class="note">第 1–8 课 · ${words.length} 词 <button class="back" data-action="lesson" data-id="0" aria-pressed="${state.lesson === 0}">全部课程</button></p>
    ${storageBlocked ? '<p class="note" role="status">当前浏览器限制了本地存储，进度暂时只在此页面保留。</p>' : ''}`;
}

function book() {
  return `<section><div class="book-head"><h1>课本词库</h1><span class="meta" id="match-count"></span></div>
    <div class="filters"><select id="book-lesson" aria-label="筛选课次"><option value="0">全部课程</option>
    ${lessons.map(l => '<option value="'+l.id+'" '+(l.id===bookLesson?'selected':'')+'>第 '+l.id+' 课 · '+escape(l.title)+'</option>').join('')}</select>
    <input id="search" type="search" value="${escape(query)}" placeholder="搜索日语、假名或中文" aria-label="搜索词库"></div>
    <ul class="word-list panel" id="word-list"></ul>
    <p class="note source-note">音调沿用词汇表。† 为词典补录，※ 为教材校注。教材未标音调的词条不显示数字。</p></section>`;
}

function normalize(value) {
  return value.normalize('NFKC').toLowerCase().trim().replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-96));
}

function renderBookList() {
  const input = normalize(query);
  const matches = (lessonFor(bookLesson)?.words || words).filter(word =>
    [word.word,word.kana,word.meaning].some(value => normalize(value).includes(input)));
  document.querySelector('#match-count').textContent = matches.length+' 词';
  document.querySelector('#word-list').innerHTML = matches.length ? matches.map(word => {
    const r = recordFor(word.id);
    return `<li><div>${wordLine(word)}<p class="kana" lang="ja">${escape(word.kana)}</p></div>
    <div>${escape(word.meaning)} <span class="meta">· ${escape(word.pos)}</span></div>
    <div class="actions"><button class="icon-button" data-action="speak" data-id="${word.id}" aria-label="朗读 ${escape(word.word)}">♫</button>
    <button class="button" data-action="familiar" data-id="${word.id}" aria-pressed="${Boolean(r.familiar)}" aria-label="${r.familiar?'取消熟记':'标记为已熟记'} ${escape(word.word)}">${r.familiar ? '已熟记 ✓' : '标记熟记'}</button></div></li>`;
  }).join('') : '<li class="empty">没有匹配的单词。</li>';
  const select = document.querySelector('#book-lesson');
  select.value = String(bookLesson);
}

function stats() {
  const learned = words.filter(word => recordFor(word.id).learned).length;
  const familiar = words.filter(word => recordFor(word.id).familiar).length;
  const today = words.filter(word => recordFor(word.id).learnedOn === dateKey()).length;
  const due = dueWords().length;
  return `<section><div class="stats-head"><h1>学习统计</h1><span class="meta">${words.length} 词</span></div>
    <div class="stat-grid">${[['已学习',learned],['已标记熟记',familiar],['今天新学',today],['待复习',due]].map(([label,n]) => '<div class="stat panel"><span class="meta">'+label+'</span><strong>'+n+'</strong></div>').join('')}</div>
    <p class="note">学习进度保存在当前浏览器。同一单词可以同时计入已学习和已标记熟记。</p></section>`;
}

function start(mode) {
  const batch = (mode === 'learn' ? newWords().slice(0,10) : dueWords().slice(0,20)).map(word => word.id);
  if (!batch.length) return;
  if (session && !['complete','spellDone'].includes(session.phase) &&
      !window.confirm('开始新一轮？已完成的词会保留，当前这轮的未完成进度将清除。')) return;
  session = {mode, lesson: state.lesson, batch, queue:[...batch], scores:{}, retries:{}, done:[], phase:'question', choices:[], spellingCorrect:0};
  show('study');
  persist();
  speakCurrent();
}

function choices(word) {
  if (!session.choices.length) {
    const other = (lessonFor(Number(word.id.split('-')[0]))?.words || words).filter(w => w.meaning !== word.meaning);
    const preferred = shuffle(other.filter(w => w.pos === word.pos));
    const pool = [...preferred, ...shuffle(other)];
    const meanings = [...new Set(pool.map(w => w.meaning))].slice(0,3);
    session.choices = shuffle([word.meaning,...meanings]);
  }
  return session.choices;
}

function stageFor(id) {
  return session.mode === 'review' && !session.retries[id] ? 1 : (session.scores[id] || 0);
}

function study() {
  if (!session) return '<section class="study panel empty"><button class="back" data-view="home">返回学习</button></section>';
  const {phase, queue, batch, done, mode} = session;
  const spelling = phase.startsWith('spell');
  const total = batch.length;
  const completed = spelling ? total - queue.length : done.length;
  const title = spelling ? '假名拼写' : mode === 'learn' ? '新词学习' : '间隔复习';
  let body;
  if (phase === 'complete' || phase === 'spellDone') {
    const title = phase === 'spellDone' ? '拼写练习完成' : mode === 'learn' ? '本轮新词已学完' : '本组复习已完成';
    const detail = phase === 'spellDone' ? '答对 '+session.spellingCorrect+' / '+total+' 个' :
      '完成 '+done.length+' 个词。下次复习到期后会自动加入复习列表。';
    body = `<section class="panel result"><h1>${title}</h1><p class="muted">${detail}</p><div class="actions">
      ${phase === 'complete' && mode === 'learn' ? '<button class="button primary" data-action="spell">练习假名拼写</button>' : ''}
      <button class="button" data-view="home">返回学习</button></div></section>`;
  } else {
    const word = byId.get(queue[0]);
    const score = session.scores[word.id] || 0;
    const stage = stageFor(word.id);
    const reveal = phase === 'feedback' || phase === 'spellFeedback';
    const prompt = spelling ? '看单词，写出假名' : ['看日文，选中文释义','看日文，回想中文意思','看中文，回想日文单词'][stage];
    const content = stage === 2 && !reveal && !spelling ? '<div class="score">'+score+'/3</div><div class="word">'+escape(word.meaning)+'</div>' :
      wordBlock(word, spelling ? 3 : score, reveal || stage === 1);
    const sound = stage !== 2 || reveal || spelling;
    body = `<section class="panel question">${reveal ? '<p class="feedback '+(session.feedback.good?'':'bad')+'" role="status">'+escape(session.feedback.label)+'</p>' : '<p class="prompt">'+prompt+'</p>'}
      ${content}${reveal ? '<p class="definition">'+escape(word.meaning)+' <span class="meta">· '+escape(word.pos)+'</span></p>' : ''}
      ${sound ? '<button class="icon-button" data-action="speak" data-id="'+word.id+'">♫ 朗读</button>' : ''}</section>`;
    if (reveal) {
      body += '<div class="choices"><button class="button primary" data-action="next">继续</button></div>';
    } else if (spelling) {
      body += '<form class="spell" id="spell-form"><input name="kana" lang="ja" placeholder="输入假名" aria-label="假名答案" autocomplete="off" required><button class="button primary">确认</button></form>';
    } else if (stage === 0) {
      body += '<div class="choices">'+choices(word).map((meaning,i) =>
        '<button class="button choice" data-action="choose" data-id="'+i+'"><small>'+String.fromCharCode(65+i)+'</small>'+escape(meaning)+'</button>').join('')+'</div>';
    } else {
      body += '<div class="rating"><button class="button" data-action="rate" data-id="forgot">忘记</button><button class="button" data-action="rate" data-id="fuzzy">模糊</button><button class="button primary" data-action="rate" data-id="remember">记得</button></div>';
    }
  }
  return `<div class="study"><div class="study-top"><button class="back" data-view="home">‹ 返回</button><span class="meta">${title} · ${completed}/${total}</span>
    <button class="back" data-action="autoplay" aria-pressed="${state.autoplay}">自动朗读${state.autoplay?'开':'关'}</button></div>
    <progress value="${completed}" max="${total}" aria-label="本轮总进度"></progress>${body}<p class="note" id="voice-message" role="status"></p></div>`;
}

function audioNotice(message) {
  let node = document.querySelector('#voice-message');
  if (!node) {
    node = document.createElement('p');
    node.id = 'voice-message';
    node.className = 'note';
    node.setAttribute('role','status');
    app.prepend(node);
  }
  node.textContent = message;
}

function speak(word, manual = false) {
  if (!word) return;
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    if (manual) audioNotice('当前浏览器不支持系统语音朗读。');
    return;
  }
  const japanese = speechSynthesis.getVoices().filter(voice => /^ja(?:[-_]|$)/i.test(voice.lang));
  if (!japanese.length) {
    if (manual) audioNotice('暂未检测到日语语音。请在设备的文字转语音设置中安装日语语音后重试。');
    return;
  }
  const utterance = new SpeechSynthesisUtterance(word.kana);
  utterance.lang = 'ja-JP';
  utterance.voice = japanese.find(voice => /^ja[-_]JP$/i.test(voice.lang)) || japanese[0];
  utterance.rate = .9;
  if (manual) utterance.onerror = event => {
    if (!['interrupted','canceled'].includes(event.error)) audioNotice('日语朗读失败，请检查设备的日语语音设置。');
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
  if (manual) audioNotice('');
}

function speakCurrent() {
  if (state.autoplay && session?.phase === 'question' && stageFor(session.queue[0]) !== 2) {
    speak(byId.get(session.queue[0]));
  }
}

function answer(good, label) {
  if (session?.phase !== 'question') return;
  const id = session.queue[0];
  const reviewing = session.mode === 'review' && !session.retries[id];
  if (reviewing && !good) session.retries[id] = true;
  if (good) session.scores[id] = reviewing ? 3 : (session.scores[id] || 0) + 1;
  session.feedback = {good,label};
  session.phase = 'feedback';
  render();
  persist();
  if (state.autoplay) speak(byId.get(id));
  app.querySelector('[data-action="next"]')?.focus({preventScroll:true});
}

function finishWord(id) {
  const old = recordFor(id);
  if (session.mode === 'learn') {
    state.records[id] = {...old, learned:true, learnedOn:dateKey(), interval:0, due:dateKey(1)};
  } else {
    const index = session.retries[id] ? 0 : Math.min((old.interval ?? 0)+1,intervals.length-1);
    state.records[id] = {...old, lastReview:dateKey(), interval:index, due:dateKey(intervals[index])};
  }
  session.done.push(id);
}

function advance() {
  if (!['feedback','spellFeedback'].includes(session?.phase)) return;
  const id = session.queue.shift();
  if (session.phase === 'spellFeedback') {
    session.phase = session.queue.length ? 'spell' : 'spellDone';
  } else {
    if (session.scores[id] === 3) finishWord(id);
    else session.queue.push(id);
    session.phase = session.queue.length ? 'question' : 'complete';
    session.choices = [];
  }
  show('study');
  persist();
  speakCurrent();
}

app.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const {action,id} = button.dataset;
  if (action === 'learn' || action === 'review') start(action);
  if (action === 'resume') { show('study'); speakCurrent(); }
  if (action === 'lesson') { state.lesson = Number(id); bookLesson = state.lesson; persist(); render(); }
  if (action === 'speak') speak(byId.get(id), true);
  if (action === 'autoplay') {
    state.autoplay = !state.autoplay;
    if (!state.autoplay && 'speechSynthesis' in window) speechSynthesis.cancel();
    persist(); render();
  }
  if (action === 'familiar') {
    const old = recordFor(id);
    state.records[id] = {...old,familiar:!old.familiar};
    persist();
    renderBookList();
    app.querySelector('[data-action="familiar"][data-id="'+id+'"]')?.focus({preventScroll:true});
  }
  if (action === 'choose' && session?.phase === 'question') {
    const good = session.choices[Number(id)] === byId.get(session.queue[0]).meaning;
    answer(good, good ? '答对了' : '再练一次');
  }
  if (action === 'rate') answer(id === 'remember', {remember:'记得',fuzzy:'模糊 · 稍后再练',forgot:'忘记 · 稍后再练'}[id]);
  if (action === 'next') advance();
  if (action === 'spell' && session?.phase === 'complete') {
    session.queue = [...session.batch];
    session.phase = 'spell';
    show('study'); persist();
  }
});

app.addEventListener('submit', event => {
  if (event.target.id !== 'spell-form' || session?.phase !== 'spell') return;
  event.preventDefault();
  const word = byId.get(session.queue[0]);
  const good = normalize(new FormData(event.target).get('kana')) === normalize(word.kana);
  if (good) session.spellingCorrect++;
  session.feedback = {good,label:good ? '拼写正确' : '核对正确假名'};
  session.phase = 'spellFeedback';
  persist(); render();
  if (state.autoplay) speak(word);
  app.querySelector('[data-action="next"]')?.focus({preventScroll:true});
});

app.addEventListener('input', event => {
  if (event.target.id === 'search') { query = event.target.value; renderBookList(); }
});
app.addEventListener('change', event => {
  if (event.target.id === 'book-lesson') { bookLesson = Number(event.target.value); renderBookList(); }
});
document.addEventListener('click', event => {
  const button = event.target.closest('[data-view]');
  if (button) show(button.dataset.view);
});
themeButton.addEventListener('click', () => {
  state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(); persist();
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();
setTheme();
render();
</script>
</body>
</html>
